name: update-data
on:
  schedule:
    - cron: "0 6 1 * *" # monthly
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python scripts/update_nginx_data.py --no-cache
      - run: uv run pytest
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- nginx_language_server/data && exit 0
          branch="update-nginx-data-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update nginx directive and variable data"
          git push --force -u origin "$branch"
          gh pr create --fill --base main --head "$branch" \
            || echo "pull request already open"
