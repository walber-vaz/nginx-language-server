name: update-data
on:
  schedule:
    - cron: "0 6 1 * *" # monthly
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-sync python scripts/update_nginx_data.py --no-cache
      - run: uv run --locked --no-sync pytest
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- nginx_language_server/data && exit 0
          branch="update-nginx-data-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update nginx directive and variable data"
          git push --force -u origin "$branch"
          gh pr create --fill --base main --head "$branch" \
            || echo "pull request already open"
